# Local production-like stack: API (+ SPA), a separate agent worker, and MongoDB.
# Secrets come from server/.env; never bake them into the image.
services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/easysales
      RUN_WORKER: "false"
    depends_on: [mongodb]
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/easysales
    depends_on: [mongodb]
    restart: unless-stopped

  mongodb:
    image: mongo:7
    command: mongod --quiet
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
